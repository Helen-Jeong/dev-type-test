<title>풀스택 개발자 성향 테스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Dark-first · centered card · max 560px */
  :root {
    --bg: #0D1117;
    --surface: #161B22;
    --surface2: #21262D;
    --border: #30363D;
    --fg: #E6EDF3;
    --fg-sub: #8B949E;
    --accent: #58A6FF;
    --accent-soft: rgba(88,166,255,.13);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F6F8FA; --surface: #fff; --surface2: #F0F2F5;
      --border: #D0D7DE; --fg: #1F2328; --fg-sub: #656D76;
      --accent: #0969DA; --accent-soft: rgba(9,105,218,.08);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #F6F8FA; --surface: #fff; --surface2: #F0F2F5;
    --border: #D0D7DE; --fg: #1F2328; --fg-sub: #656D76;
    --accent: #0969DA; --accent-soft: rgba(9,105,218,.08);
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100%;
    display: flex;
    justify-content: center;
    padding-inline: 20px;
    padding-block: 48px;
  }

  .wrap { width: 100%; max-width: 560px; }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ── SHARED ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  .badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .7px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 4px 14px;
    margin-bottom: 20px;
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    margin-top: 4px;
  }
  .btn-primary:hover { opacity: .88; }
  .btn-primary:active { transform: scale(.99); }

  /* ── INTRO ── */
  .intro-top { text-align: center; margin-bottom: 32px; }

  .intro-title {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 10px;
    text-wrap: balance;
  }

  .intro-sub {
    font-size: 14px;
    color: var(--fg-sub);
    line-height: 1.75;
  }

  .emoji-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    font-size: 40px;
    margin: 26px 0;
  }

  .float-e {
    display: inline-block;
    animation: floaty 2.8s ease-in-out infinite;
  }
  .float-e:nth-child(2) { animation-delay: .35s; }
  .float-e:nth-child(3) { animation-delay: .7s; }
  .float-e:nth-child(4) { animation-delay: 1.05s; }
  .float-e:nth-child(5) { animation-delay: 1.4s; }
  @keyframes floaty {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @media (prefers-reduced-motion: reduce) { .float-e { animation: none; } }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .6px;
    color: var(--fg-sub);
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--fg);
    font-size: 15px;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    outline: none;
    transition: border-color .2s;
    -webkit-appearance: none;
  }
  .field input:focus { border-color: var(--accent); }

  .err-msg {
    font-size: 12px;
    color: #F85149;
    margin-top: -10px;
    margin-bottom: 14px;
    display: none;
  }
  .err-msg.show { display: block; }

  /* ── QUIZ ── */
  .prog-area { margin-bottom: 30px; }

  .prog-meta {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .prog-label, .prog-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--fg-sub);
    letter-spacing: .4px;
  }

  .prog-track {
    height: 3px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }

  .prog-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width .4s ease;
  }

  .q-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: .5px;
    margin-bottom: 10px;
  }

  .q-text {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.55;
    margin-bottom: 22px;
    text-wrap: balance;
  }

  .opts { display: flex; flex-direction: column; gap: 9px; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 16px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    text-align: left;
    font-size: 14px;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    color: var(--fg);
    line-height: 1.55;
    width: 100%;
  }
  .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
  .opt.sel  { border-color: var(--accent); background: var(--accent-soft); }

  .opt-key {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    background: var(--surface2);
    border-radius: 6px;
    padding: 2px 7px;
    flex-shrink: 0;
    font-weight: 600;
    margin-top: 2px;
  }

  .quiz-foot {
    display: flex;
    gap: 10px;
    margin-top: 26px;
  }

  .btn-back {
    padding: 12px 18px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--fg-sub);
    font-size: 14px;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity .15s;
  }
  .btn-back:hover { opacity: .7; }

  .btn-next {
    flex: 1;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    cursor: pointer;
    transition: opacity .15s;
    opacity: .32;
    pointer-events: none;
  }
  .btn-next.on { opacity: 1; pointer-events: auto; }

  /* ── RESULT ── */
  .res-hero {
    text-align: center;
    padding: 36px 24px 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 14px;
  }

  .res-big-emoji {
    font-size: 80px;
    display: block;
    margin-bottom: 16px;
    animation: popIn .55s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes popIn {
    from { transform: scale(.2); opacity: 0; }
    to   { transform: scale(1);  opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .res-big-emoji { animation: none; } }

  .res-who {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--fg-sub);
    margin-bottom: 6px;
  }

  .res-type-name {
    font-size: 25px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .res-chip {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 4px 14px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: .4px;
  }

  .res-body {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .sec-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--fg-sub);
    letter-spacing: .9px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .res-desc {
    font-size: 14px;
    line-height: 1.85;
    color: var(--fg);
  }

  .traits {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .trait {
    font-size: 13px;
    padding: 5px 13px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--fg-sub);
  }

  .compat-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface2);
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--fg-sub);
  }

  .compat-icon { font-size: 24px; flex-shrink: 0; }

  .share-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 12px;
  }

  .share-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.8;
    color: var(--fg-sub);
    white-space: pre-line;
    margin-bottom: 14px;
  }

  .btn-copy {
    width: 100%;
    padding: 11px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-copy:hover { opacity: .72; }

  .btn-retry {
    width: 100%;
    padding: 13px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--fg-sub);
    font-size: 14px;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-retry:hover { opacity: .65; }

  /* ── SUBMIT STATUS ── */
  .sub-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-align: center;
    padding: 10px 16px;
    border-radius: 10px;
    margin-bottom: 12px;
    display: none;
    letter-spacing: .3px;
  }
  .sub-status.show { display: block; }
  .sub-status.sending { color: var(--fg-sub); background: var(--surface2); border: 1px solid var(--border); }
  .sub-status.ok   { color: #3FB950; background: rgba(63,185,80,.1); border: 1px solid rgba(63,185,80,.3); }
  .sub-status.fail  { color: #F85149; background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.3); }
</style>

<div class="wrap">
  <!-- INTRO -->
  <div id="sc-intro" class="screen active">
    <div class="intro-top">
      <span class="badge">FULLSTACK @ DEV TYPE TEST</span>
      <h1 class="intro-title">나는 어떤 개발자일까? 🔍</h1>
      <p class="intro-sub">15개의 질문으로 알아보는<br>나의 개발 성향 유형</p>
      <div class="emoji-row">
        <span class="float-e">🐻</span>
        <span class="float-e">🐧</span>
        <span class="float-e">🐱</span>
        <span class="float-e">🦊</span>
        <span class="float-e">🐙</span>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label for="inp-kisu">기수 // COHORT</label>
        <input type="number" id="inp-kisu" placeholder="예) 17" min="1" max="99">
      </div>
      <div class="field">
        <label for="inp-name">이름 // NAME</label>
        <input type="text" id="inp-name" placeholder="이름을 입력해주세요">
      </div>
      <p class="err-msg" id="err-msg">기수와 이름을 모두 입력해주세요!</p>
      <button class="btn-primary" onclick="startQuiz()">테스트 시작하기 →</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="sc-quiz" class="screen">
    <div class="prog-area">
      <div class="prog-meta">
        <span class="prog-label">// PROGRESS</span>
        <span class="prog-count" id="prog-count">1 / 15</span>
      </div>
      <div class="prog-track">
        <div class="prog-fill" id="prog-fill" style="width:0%"></div>
      </div>
    </div>

    <p class="q-eyebrow" id="q-eyebrow">Q.01</p>
    <p class="q-text" id="q-text"></p>
    <div class="opts" id="opts"></div>

    <div class="quiz-foot">
      <button class="btn-back" id="btn-back" onclick="prevQ()">← 이전</button>
      <button class="btn-next" id="btn-next" onclick="nextQ()">다음 →</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="sc-result" class="screen">
    <div class="res-hero">
      <span class="res-big-emoji" id="res-emoji"></span>
      <p class="res-who" id="res-who"></p>
      <h2 class="res-type-name" id="res-type-name"></h2>
      <span class="res-chip" id="res-chip"></span>
    </div>

    <div class="res-body">
      <div>
        <p class="sec-label">// DESCRIPTION</p>
        <p class="res-desc" id="res-desc"></p>
      </div>
      <div>
        <p class="sec-label">// TRAITS</p>
        <div class="traits" id="res-traits"></div>
      </div>
      <div>
        <p class="sec-label">// 잘 맞는 유형</p>
        <div class="compat-row">
          <span class="compat-icon" id="res-compat-icon"></span>
          <span id="res-compat-text"></span>
        </div>
      </div>
    </div>

    <div id="sub-status" class="sub-status"></div>

    <div class="share-box">
      <p class="sec-label">// SHARE</p>
      <div class="share-text" id="share-text"></div>
      <button class="btn-copy" id="btn-copy" onclick="copyResult()">📋 결과 복사하기</button>
    </div>

    <button class="btn-retry" onclick="resetQuiz()">↩ 다시 테스트하기</button>
  </div>
</div>

<script>
const QS = [
  { q: "코딩 시작 전 나의 루틴은?", opts: [
    { k:"A", t:"폴더 구조랑 파일명부터 다 정리하고 시작", tp:0 },
    { k:"B", t:"README 초안부터 작성하고 시작", tp:1 },
    { k:"C", t:"딱히 정해진 루틴 없이 그날 기분대로 시작", tp:2 },
    { k:"D", t:"비슷한 프로젝트 레퍼런스 먼저 검색", tp:3 },
    { k:"E", t:"프론트/백 구조 머릿속으로 동시에 그려보고 시작", tp:4 },
  ]},
  { q: "에러가 발생했다. 나의 첫 반응은?", opts: [
    { k:"A", t:"에러 메시지 처음부터 끝까지 정독", tp:0 },
    { k:"B", t:"에러 로그 문서에 기록해두고 분석", tp:1 },
    { k:"C", t:"일단 껐다 켜봄. 그래도 안 되면 그때 봄", tp:2 },
    { k:"D", t:"바로 구글에 에러 메시지 복붙", tp:3 },
    { k:"E", t:"콘솔창 열고 console.log 난사", tp:4 },
  ]},
  { q: "팀 프로젝트에서 나는 주로?", opts: [
    { k:"A", t:"전체 구조 설계하고 역할 분배", tp:0 },
    { k:"B", t:"문서화, 회의록, 컨벤션 정리 담당", tp:1 },
    { k:"C", t:"맡은 부분 내 방식대로 조용히 완성", tp:2 },
    { k:"D", t:"막히면 레퍼런스 찾아서 팀에 공유", tp:3 },
    { k:"E", t:"프론트도 백도 다 건드리며 돌아다님", tp:4 },
  ]},
  { q: "커밋 메시지 스타일은?", opts: [
    { k:"A", t:"feat: 로그인 기능 구현 — JWT 토큰 방식 적용", tp:0 },
    { k:"B", t:"커밋 컨벤션 문서 만들어두고 팀원한테 공유", tp:1 },
    { k:"C", t:"의미만 전달되면 OK. 형식은 크게 안 따짐", tp:2 },
    { k:"D", t:"구글에서 컨벤션 찾아서 그대로 따라함", tp:3 },
    { k:"E", t:"기능별로 잘게 쪼개서 여러 번 커밋", tp:4 },
  ]},
  { q: "코드 리뷰를 받았는데 수정 사항이 10개다. 나는?", opts: [
    { k:"A", t:"하나씩 다 고치고 왜 고쳤는지 답글 달기", tp:0 },
    { k:"B", t:"고치면서 관련 문서도 같이 업데이트", tp:1 },
    { k:"C", t:"핵심만 수정하고 나머지는 다음 PR에서", tp:2 },
    { k:"D", t:"수정 방법 모르는 건 검색해서 해결", tp:3 },
    { k:"E", t:"수정하면서 다른 부분도 같이 리팩토링", tp:4 },
  ]},
  { q: "변수명을 짓는 데 걸리는 시간은?", opts: [
    { k:"A", t:"5분 이상. 의미 전달이 제일 중요", tp:0 },
    { k:"B", t:"네이밍 컨벤션 문서 열어보고 결정", tp:1 },
    { k:"C", t:"딱 생각나는 이름으로 바로 결정", tp:2 },
    { k:"D", t:"검색해서 보편적으로 쓰는 이름 채택", tp:3 },
    { k:"E", t:"프론트/백 일관성 맞춰서 결정", tp:4 },
  ]},
  { q: "프로젝트 마감 하루 전 나의 상태는?", opts: [
    { k:"A", t:"이미 다 끝내고 최종 점검 중", tp:0 },
    { k:"B", t:"문서 마무리하며 최종 정리 중", tp:1 },
    { k:"C", t:"핵심 기능은 됐으니 나머지는 내일 아침에", tp:2 },
    { k:"D", t:"스택오버플로우 30탭 열어놓고 복붙 중", tp:3 },
    { k:"E", t:"프론트 고치다 백 건드리다 다시 프론트", tp:4 },
  ]},
  { q: "주석을 다는 나의 스타일은?", opts: [
    { k:"A", t:"복잡한 로직에 이유까지 상세히", tp:0 },
    { k:"B", t:"함수마다 JSDoc 형식으로 꼼꼼하게", tp:1 },
    { k:"C", t:"내가 나중에 알아볼 수 있을 정도로만", tp:2 },
    { k:"D", t:"나중에 헷갈릴 것 같은 부분에만", tp:3 },
    { k:"E", t:"프론트/백 경계마다 역할 설명 주석", tp:4 },
  ]},
  { q: "막히는 부분이 생겼을 때 나는?", opts: [
    { k:"A", t:"공식 문서부터 정독", tp:0 },
    { k:"B", t:"에러 상황 기록하고 원인 분석", tp:1 },
    { k:"C", t:"잠깐 환기하고 나서 다시 봄", tp:2 },

const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwOWpZKvS7JaJCufv9GEGgK1Gm34jpy4SAfzRA5bc-uhyeWnx4dL7hxn8OrvtY5xjb2Vg/exec';

let curQ = 0, answers = new Array(15).fill(null), userName = "", userKisu = "";

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function startQuiz() {
  const kisu = document.getElementById('inp-kisu').value.trim();
  const name = document.getElementById('inp-name').value.trim();
  const err = document.getElementById('err-msg');
  if (!kisu || !name) { err.classList.add('show'); return; }
  err.classList.remove('show');
  userKisu = kisu; userName = name;
  curQ = 0; answers = new Array(15).fill(null);
  show('sc-quiz');
  renderQ();
}

function renderQ() {
  const q = QS[curQ];
  document.getElementById('prog-count').textContent = `${curQ+1} / 15`;
  document.getElementById('prog-fill').style.width = `${(curQ/15)*100}%`;
  document.getElementById('q-eyebrow').textContent = `Q.${String(curQ+1).padStart(2,'0')}`;
  document.getElementById('q-text').textContent = q.q;

  const list = document.getElementById('opts');
  list.innerHTML = '';
  q.opts.forEach((o, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (answers[curQ] === i ? ' sel' : '');
    btn.innerHTML = `<span class="opt-key">${o.k}</span><span>${o.t}</span>`;
    btn.onclick = () => pick(i);
    list.appendChild(btn);
  });

  const nxt = document.getElementById('btn-next');
  const hasAns = answers[curQ] !== null;
  nxt.classList.toggle('on', hasAns);
  nxt.textContent = curQ === 14 ? '결과 보기 →' : '다음 →';

  document.getElementById('btn-back').style.visibility = curQ === 0 ? 'hidden' : 'visible';
}

function pick(i) {
  answers[curQ] = i;
  document.querySelectorAll('.opt').forEach((b, idx) => b.classList.toggle('sel', idx === i));
  const nxt = document.getElementById('btn-next');
  nxt.classList.add('on');
  nxt.textContent = curQ === 14 ? '결과 보기 →' : '다음 →';
}

function nextQ() {
  if (answers[curQ] === null) return;
  if (curQ < 14) { curQ++; renderQ(); }
  else showResult();
}

function prevQ() {
  if (curQ > 0) { curQ--; renderQ(); }
}

function showResult() {
  const scores = [0,0,0,0,0];
  answers.forEach((a, qi) => { if (a !== null) scores[QS[qi].opts[a].tp]++; });
  let best = 0;
  scores.forEach((s,i) => { if (s > scores[best]) best = i; });
  const t = TYPES[best];

  document.getElementById('res-emoji').textContent = t.emoji;
  document.getElementById('res-who').textContent = `${userKisu}기 · ${userName}`;
  document.getElementById('res-type-name').textContent = t.name;

  const chip = document.getElementById('res-chip');
  chip.textContent = t.chip;
  chip.style.cssText = `background:${t.colorBg};color:${t.color};border:1px solid ${t.color}`;

  document.getElementById('res-desc').textContent = t.desc;
  document.getElementById('res-traits').innerHTML = t.traits.map(tr => `<span class="trait">${tr}</span>`).join('');
  document.getElementById('res-compat-icon').textContent = t.compatIcon;
  document.getElementById('res-compat-text').textContent = t.compatText;

  document.getElementById('share-text').textContent =
    `// 풀스택 개발자 성향 테스트 결과\n나는 ${t.emoji} ${t.name}!\n${userKisu}기 ${userName}\n\n"${t.traits.join(' · ')}"\n#풀스택 #개발자성향테스트`;

  show('sc-result');
  submitResult(t);
}

function submitResult(t) {
  const el = document.getElementById('sub-status');
  el.className = 'sub-status show sending';
  el.textContent = '⏳ 결과 저장 중...';

  fetch(WEBHOOK_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ kisu: userKisu, name: userName, typeEmoji: t.emoji, typeName: t.name })
  })
  .then(() => {
    el.className = 'sub-status show ok';
    el.textContent = '✅ 결과가 시트에 저장됐어요!';
  })
  .catch(() => {
    el.className = 'sub-status show fail';
    el.textContent = '⚠️ 저장 실패 (결과는 확인 가능해요)';
  });
}

function copyResult() {
  const text = document.getElementById('share-text').textContent;
  const btn = document.getElementById('btn-copy');
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ 복사 완료!';
    setTimeout(() => { btn.textContent = '📋 결과 복사하기'; }, 2000);
  }).catch(() => {
    btn.textContent = '위 텍스트를 직접 복사해주세요';
    setTimeout(() => { btn.textContent = '📋 결과 복사하기'; }, 2500);
  });
}

function resetQuiz() {
  document.getElementById('inp-kisu').value = '';
  document.getElementById('inp-name').value = '';
  show('sc-intro');
}
</script>
