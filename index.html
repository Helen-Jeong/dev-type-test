<title>풀스택 개발자 성향 테스트</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;700&display=swap">
<style>
  :root {
    --bg: #0D1219;
    --surface: #161C26;
    --surface2: #1E2530;
    --border: #2E3844;
    --fg: #E4EAF5;
    --fg-sub: #8E9DB5;
    --accent: #58A6FF;
    --accent-soft: rgba(88,166,255,.13);
    --grid-dot: rgba(88,166,255,.03);
    --err: #F85149;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F3F7FC; --surface: #fff; --surface2: #E8EEF6;
      --border: #C8D5E8; --fg: #1A2535; --fg-sub: #5B6B82;
      --accent: #1D6BCC; --accent-soft: rgba(29,107,204,.09);
      --grid-dot: rgba(29,107,204,.04);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #F3F7FC; --surface: #fff; --surface2: #E8EEF6;
    --border: #C8D5E8; --fg: #1A2535; --fg-sub: #5B6B82;
    --accent: #1D6BCC; --accent-soft: rgba(29,107,204,.09);
    --grid-dot: rgba(29,107,204,.04);
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans KR', system-ui, sans-serif;
    background-color: var(--bg);
    background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--fg);
    min-height: 100%;
    display: flex;
    justify-content: center;
    padding-inline: 20px;
    padding-block: 48px;
  }

  .wrap { width: 100%; max-width: 560px; }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ── SHARED ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
  }

  .badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .7px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 4px 14px;
    margin-bottom: 20px;
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    font-family: 'IBM Plex Sans KR', system-ui, sans-serif;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    margin-top: 4px;
  }
  .btn-primary:hover { opacity: .88; }
  .btn-primary:active { transform: scale(.99); }

  /* ── INTRO ── */
  .intro-top { text-align: center; margin-bottom: 32px; }

  .intro-title {
    font-family: 'Hahmlet', serif;
    font-size: 27px;
    font-weight: 700;
    line-height: 1.45;
    margin-bottom: 10px;
    text-wrap: balance;
  }

  .intro-sub {
    font-size: 14px;
    color: var(--fg-sub);
    line-height: 1.75;
  }

  .emoji-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    font-size: 40px;
    margin: 26px 0;
  }

  .float-e {
    display: inline-block;
    animation: floaty 2.8s ease-in-out infinite;
  }
  .float-e:nth-child(2) { animation-delay: .35s; }
  .float-e:nth-child(3) { animation-delay: .7s; }
  .float-e:nth-child(4) { animation-delay: 1.05s; }
  .float-e:nth-child(5) { animation-delay: 1.4s; }
  @keyframes floaty {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @media (prefers-reduced-motion: reduce) { .float-e { animation: none; } }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .6px;
    color: var(--fg-sub);
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--fg);
    font-size: 15px;
    font-family: 'IBM Plex Sans KR', system-ui, sans-serif;
    outline: none;
    transition: border-color .2s;
    -webkit-appearance: none;
  }
  .field input:focus { border-color: var(--accent); }

  .err-msg {
    font-size: 12px;
    color: var(--err);
    margin-top: -10px;
    margin-bottom: 14px;
    display: none;
  }
  .err-msg.show { display: block; }

  /* ── QUIZ ── */
  .prog-area { margin-bottom: 30px; }

  .prog-meta {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .prog-label, .prog-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--fg-sub);
    letter-spacing: .4px;
    font-variant-numeric: tabular-nums;
  }

  .prog-track {
    position: relative;
    height: 4px;
    background-color: var(--surface2);
    background-image: repeating-linear-gradient(
      to right, var(--border) 0 1px, transparent 1px 10%
    );
    border-radius: 2px;
    overflow: hidden;
  }

  .prog-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width .4s ease;
  }

  .q-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: .5px;
    margin-bottom: 10px;
  }

  .q-text {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.55;
    margin-bottom: 22px;
    text-wrap: balance;
  }

  .opts { display: flex; flex-direction: column; gap: 9px; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 16px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    text-align: left;
    font-size: 14px;
    font-family: 'IBM Plex Sans KR', system-ui, sans-serif;
    color: var(--fg);
    line-height: 1.55;
    width: 100%;
  }
  .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
  .opt.sel  { border-color: var(--accent); background: var(--accent-soft); }

  .opt-key {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    background: var(--surface2);
    border-radius: 4px;
    padding: 2px 7px;
    flex-shrink: 0;
    font-weight: 700;
    margin-top: 2px;
  }

  .quiz-foot {
    display: flex;
    gap: 10px;
    margin-top: 26px;
  }

  .btn-back {
    padding: 12px 18px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--fg-sub);
    font-size: 14px;
    font-family: 'IBM Plex Sans KR', system-ui, sans-serif;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity .15s;
  }
  .btn-back:hover { opacity: .7; }

  /* ── RESULT ── */
  .res-hero {
    text-align: center;
    padding: 36px 24px 28px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 16px;
    margin-bottom: 14px;
    transition: border-color .5s, box-shadow .5s;
  }

  .res-big-emoji {
    font-size: 88px;
    display: block;
    margin-bottom: 16px;
    transform-origin: center bottom;
  }

  @keyframes popIn {
    0%   { transform: scale(.1) rotate(-15deg); opacity: 0; }
    60%  { transform: scale(1.18) rotate(6deg); opacity: 1; }
    80%  { transform: scale(.93) rotate(-3deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  /* 동물별 결과 이모지 애니메이션 — more dynamic */
  .anim-bear {
    animation: popIn .65s cubic-bezier(.34,1.56,.64,1) both,
               bearSway 2.8s 1s ease-in-out infinite;
  }
  .anim-penguin {
    animation: popIn .65s cubic-bezier(.34,1.56,.64,1) both,
               penguinWaddle 1.8s 1s ease-in-out infinite;
  }
  .anim-cat {
    animation: popIn .65s cubic-bezier(.34,1.56,.64,1) both,
               catStretch 2.6s 1s ease-in-out infinite;
  }
  .anim-fox {
    animation: popIn .65s cubic-bezier(.34,1.56,.64,1) both,
               foxDart 2.2s 1s ease-in-out infinite;
  }
  .anim-octopus {
    animation: popIn .65s cubic-bezier(.34,1.56,.64,1) both,
               octopusWave 2s 1s ease-in-out infinite;
  }

  @keyframes bearSway {
    0%,100% { transform: rotate(0) scale(1); }
    20%     { transform: rotate(-9deg) scale(1.05); }
    50%     { transform: rotate(8deg) scale(.97); }
    75%     { transform: rotate(-5deg) scale(1.02); }
  }
  @keyframes penguinWaddle {
    0%,100% { transform: translateX(0) rotate(0); }
    20%     { transform: translateX(-10px) rotate(-8deg); }
    50%     { transform: translateX(10px) rotate(8deg); }
    75%     { transform: translateX(-5px) rotate(-4deg); }
  }
  @keyframes catStretch {
    0%,100% { transform: scaleX(1) scaleY(1) translateY(0); }
    25%     { transform: scaleX(1.14) scaleY(.88) translateY(4px); }
    55%     { transform: scaleX(.88) scaleY(1.14) translateY(-7px); }
    80%     { transform: scaleX(1.06) scaleY(.96) translateY(2px); }
  }
  @keyframes foxDart {
    0%,100% { transform: translateX(0) rotate(0); }
    12%     { transform: translateX(-14px) rotate(-5deg); }
    25%     { transform: translateX(0) rotate(0); }
    55%     { transform: translateX(12px) rotate(4deg); }
    72%     { transform: translateX(-6px) rotate(-2deg); }
    85%     { transform: translateX(0) rotate(0); }
  }
  @keyframes octopusWave {
    0%,100% { transform: translateY(0) rotate(0) scale(1); }
    20%     { transform: translateY(-12px) rotate(-7deg) scale(1.06); }
    50%     { transform: translateY(-7px) rotate(7deg) scale(.96); }
    75%     { transform: translateY(-10px) rotate(-4deg) scale(1.03); }
  }

  @media (prefers-reduced-motion: reduce) {
    .res-big-emoji { animation: none !important; }
  }

  .res-who {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--fg-sub);
    margin-bottom: 6px;
  }

  .res-type-name {
    font-family: 'Hahmlet', serif;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .res-chip {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 4px 14px;
    border-radius: 999px;
    font-weight: 700;
    letter-spacing: .4px;
  }

  .res-body {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .sec-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--fg-sub);
    letter-spacing: .9px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .res-desc {
    font-size: 14px;
    line-height: 1.85;
    color: var(--fg);
  }

  .traits {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .trait {
    font-size: 13px;
    padding: 5px 13px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--fg-sub);
  }

  .compat-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface2);
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--fg-sub);
  }

  .compat-icon { font-size: 24px; flex-shrink: 0; }

  /* ── SHARE — 아트보드 코너 장식 ── */
  .share-box {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 12px;
  }
  .share-box::before {
    content: "";
    position: absolute; top: -1px; left: -1px;
    width: 14px; height: 14px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
    border-radius: 16px 0 0 0;
  }
  .share-box::after {
    content: "";
    position: absolute; bottom: -1px; right: -1px;
    width: 14px; height: 14px;
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
    border-radius: 0 0 16px 0;
  }

  .share-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    line-height: 1.8;
    color: var(--fg-sub);
    white-space: pre-line;
    margin-bottom: 14px;
  }

  .btn-copy {
    width: 100%;
    padding: 11px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-copy:hover { opacity: .72; }

  .btn-retry {
    width: 100%;
    padding: 13px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--fg-sub);
    font-size: 14px;
    font-family: 'IBM Plex Sans KR', system-ui, sans-serif;
    cursor: pointer;
    transition: opacity .15s;
    margin-bottom: 48px;
  }
  .btn-retry:hover { opacity: .65; }

  /* ── SUBMIT STATUS ── */
  .sub-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-align: center;
    padding: 10px 16px;
    border-radius: 10px;
    margin-bottom: 12px;
    display: none;
    letter-spacing: .3px;
  }
  .sub-status.show { display: block; }
  .sub-status.sending { color: var(--fg-sub); background: var(--surface2); border: 1px solid var(--border); }
  .sub-status.ok   { color: #3FB950; background: rgba(63,185,80,.1); border: 1px solid rgba(63,185,80,.3); }
  .sub-status.fail  { color: var(--err); background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.3); }
</style>

<div class="wrap">
  <!-- INTRO -->
  <div id="sc-intro" class="screen active">
    <div class="intro-top">
      <span class="badge">FULLSTACK @ DEV TYPE TEST</span>
      <h1 class="intro-title">나는 어떤 개발자일까? 🔍</h1>
      <p class="intro-sub">10개의 질문으로 알아보는<br>나의 개발 성향 유형</p>
      <div class="emoji-row">
        <span class="float-e">🐻</span>
        <span class="float-e">🐧</span>
        <span class="float-e">🐱</span>
        <span class="float-e">🦊</span>
        <span class="float-e">🐙</span>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label for="inp-kisu">기수 // COHORT</label>
        <input type="number" id="inp-kisu" placeholder="예) 17" min="1" max="99">
      </div>
      <div class="field">
        <label for="inp-name">이름 // NAME</label>
        <input type="text" id="inp-name" placeholder="이름을 입력해주세요">
      </div>
      <p class="err-msg" id="err-msg">기수와 이름을 모두 입력해주세요!</p>
      <button class="btn-primary" onclick="startQuiz()">테스트 시작하기 →</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="sc-quiz" class="screen">
    <div class="prog-area">
      <div class="prog-meta">
        <span class="prog-label">// PROGRESS</span>
        <span class="prog-count" id="prog-count">1 / 10</span>
      </div>
      <div class="prog-track">
        <div class="prog-fill" id="prog-fill" style="width:0%"></div>
      </div>
    </div>

    <p class="q-eyebrow" id="q-eyebrow">Q.01</p>
    <p class="q-text" id="q-text"></p>
    <div class="opts" id="opts"></div>

    <div class="quiz-foot">
      <button class="btn-back" id="btn-back" onclick="prevQ()">← 이전</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="sc-result" class="screen">
    <div class="res-hero" id="res-hero">
      <span class="res-big-emoji" id="res-emoji"></span>
      <p class="res-who" id="res-who"></p>
      <h2 class="res-type-name" id="res-type-name"></h2>
      <span class="res-chip" id="res-chip"></span>
    </div>

    <div class="res-body">
      <div>
        <p class="sec-label">// DESCRIPTION</p>
        <p class="res-desc" id="res-desc"></p>
      </div>
      <div>
        <p class="sec-label">// TRAITS</p>
        <div class="traits" id="res-traits"></div>
      </div>
      <div>
        <p class="sec-label">// 잘 맞는 유형</p>
        <div class="compat-row">
          <span class="compat-icon" id="res-compat-icon"></span>
          <span id="res-compat-text"></span>
        </div>
      </div>
    </div>

    <div id="sub-status" class="sub-status"></div>

    <div class="share-box">
      <p class="sec-label">// SHARE</p>
      <div class="share-text" id="share-text"></div>
      <button class="btn-copy" id="btn-copy" onclick="copyResult()">📋 결과 복사하기</button>
    </div>

    <button class="btn-retry" onclick="resetQuiz()">↩ 다시 테스트하기</button>
  </div>
</div>

<script>
const QS = [
  { q: "코딩 시작 전 나의 루틴은?", opts: [
    { k:"A", t:"딱히 정해진 루틴 없이 그날 기분대로 시작", tp:2 },
    { k:"B", t:"프론트/백 구조 머릿속으로 동시에 그려보고 시작", tp:4 },
    { k:"C", t:"폴더 구조랑 파일명부터 다 정리하고 시작", tp:0 },
    { k:"D", t:"비슷한 프로젝트 레퍼런스 먼저 검색하고 시작", tp:3 },
    { k:"E", t:"README 초안부터 작성하고 시작", tp:1 },
  ]},
  { q: "🚨 에러가 발생했다. 나의 첫 반응은?", opts: [
    { k:"A", t:"바로 구글에 에러 메시지 복붙해야겠어", tp:3 },
    { k:"B", t:"에러 메시지 처음부터 끝까지 정독해야겠어", tp:0 },
    { k:"C", t:"콘솔창 열고 console.log 찍어봐야겠어", tp:4 },
    { k:"D", t:"일단 껐다 켜봐야겠어", tp:2 },
    { k:"E", t:"에러 로그 문서에 기록하고 분석해야겠어", tp:1 },
  ]},
    { q: "커밋 메시지 스타일은?", opts: [
    { k:"A", t:"컨벤션 팀원과 정해서 그대로 지키는 스타일 — \"[feat] 로그인 기능 추가\"", tp:1 },
    { k:"B", t:"일단 되면 올리는 스타일 — \"수정\", \"ㅇ\", \"asdf\"", tp:3 },
    { k:"C", t:"이유까지 꼼꼼히 적는 스타일 — \"feat: 소수점 오류 방지 위해 toFixed(2) 적용\"", tp:0 },
    { k:"D", t:"기능별로 잘게 쪼개는 스타일 — 하루에 커밋 10개도 OK", tp:4 },
    { k:"E", t:"의미만 전달되면 OK — \"로그인 됨\", \"버그 고침\"", tp:2 },
  ]},
  { q: "팀 프로젝트에서 나는 주로?", opts: [
    { k:"A", t:"프론트도 백도 다 건드리는 멀티플레이어", tp:4 },
    { k:"B", t:"회의록, 컨벤션, 문서화 담당하는 기록자", tp:1 },

const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwOWpZKvS7JaJCufv9GEGgK1Gm34jpy4SAfzRA5bc-uhyeWnx4dL7hxn8OrvtY5xjb2Vg/exec';
const ANIM_CLASS = ['anim-bear','anim-penguin','anim-cat','anim-fox','anim-octopus'];

const TOTAL = 10;
let curQ = 0, answers = new Array(TOTAL).fill(null), userName = "", userKisu = "";

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function startQuiz() {
  const kisu = document.getElementById('inp-kisu').value.trim();
  const name = document.getElementById('inp-name').value.trim();
  const err = document.getElementById('err-msg');
  if (!kisu || !name) { err.classList.add('show'); return; }
  err.classList.remove('show');
  userKisu = kisu; userName = name;
  curQ = 0; answers = new Array(TOTAL).fill(null);
  show('sc-quiz');
  renderQ();
}

function renderQ() {
  const q = QS[curQ];
  document.getElementById('prog-count').textContent = `${curQ+1} / ${TOTAL}`;
  document.getElementById('prog-fill').style.width = `${(curQ/TOTAL)*100}%`;
  document.getElementById('q-eyebrow').textContent = `Q.${String(curQ+1).padStart(2,'0')}`;
  document.getElementById('q-text').textContent = q.q;

  const list = document.getElementById('opts');
  list.innerHTML = '';
  q.opts.forEach((o, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (answers[curQ] === i ? ' sel' : '');
    btn.innerHTML = `<span class="opt-key">${o.k}</span><span>${o.t}</span>`;
    btn.onclick = () => pick(i);
    list.appendChild(btn);
  });

  document.getElementById('btn-back').style.visibility = curQ === 0 ? 'hidden' : 'visible';
}

function pick(i) {
  answers[curQ] = i;
  document.querySelectorAll('.opt').forEach((b, idx) => b.classList.toggle('sel', idx === i));
  setTimeout(() => {
    if (curQ < TOTAL - 1) { curQ++; renderQ(); }
    else showResult();
  }, 320);
}

function prevQ() {
  if (curQ > 0) { curQ--; renderQ(); }
}

function showResult() {
  const scores = [0,0,0,0,0];
  answers.forEach((a, qi) => { if (a !== null) scores[QS[qi].opts[a].tp]++; });
  let best = 0;
  scores.forEach((s,i) => { if (s > scores[best]) best = i; });
  const t = TYPES[best];

  const emojiEl = document.getElementById('res-emoji');
  emojiEl.textContent = t.emoji;
  emojiEl.className = 'res-big-emoji ' + (ANIM_CLASS[best] || '');

  // 동물 색으로 결과 카드 테두리 변경
  const heroEl = document.getElementById('res-hero');
  heroEl.style.borderColor = t.color;
  heroEl.style.boxShadow = `0 0 28px ${t.colorBg}, 0 0 6px ${t.colorBg}`;

  document.getElementById('res-who').textContent = `${userKisu}기 · ${userName}`;
  document.getElementById('res-type-name').textContent = t.name;

  const chip = document.getElementById('res-chip');
  chip.textContent = t.chip;
  chip.style.cssText = `background:${t.colorBg};color:${t.color};border:1px solid ${t.color}`;

  document.getElementById('res-desc').textContent = t.desc;
  document.getElementById('res-traits').innerHTML = t.traits.map(tr => `<span class="trait">${tr}</span>`).join('');
  document.getElementById('res-compat-icon').textContent = t.compatIcon;
  document.getElementById('res-compat-text').textContent = t.compatText;

  document.getElementById('share-text').textContent =
    `// 풀스택 개발자 성향 테스트 결과\n${userKisu}기 ${userName}\n\n나는 ${t.emoji} ${t.name}! ${t.shortDesc} 유형이에요.\n\n잘 맞는 유형: ${t.compatIcon} ${t.compatText}\n\n#풀스택 #개발자성향테스트`;

  show('sc-result');
  submitResult(t);
}

function submitResult(t) {
  const el = document.getElementById('sub-status');
  el.className = 'sub-status show sending';
  el.textContent = '⏳ 결과 저장 중...';

  fetch(WEBHOOK_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ kisu: userKisu, name: userName, typeEmoji: t.emoji, typeName: t.name })
  })
  .then(() => {
    el.className = 'sub-status show ok';
    el.textContent = '✅ 결과가 시트에 저장됐어요!';
  })
  .catch(() => {
    el.className = 'sub-status show fail';
    el.textContent = '⚠️ 저장 실패 (결과는 확인 가능해요)';
  });
}

function copyResult() {
  const text = document.getElementById('share-text').textContent;
  const btn = document.getElementById('btn-copy');
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ 복사 완료!';
    setTimeout(() => { btn.textContent = '📋 결과 복사하기'; }, 2000);
  }).catch(() => {
    btn.textContent = '위 텍스트를 직접 복사해주세요';
    setTimeout(() => { btn.textContent = '📋 결과 복사하기'; }, 2500);
  });
}

function resetQuiz() {
  document.getElementById('inp-kisu').value = '';
  document.getElementById('inp-name').value = '';
  show('sc-intro');
}
